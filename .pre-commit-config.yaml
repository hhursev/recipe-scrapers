exclude: '.test(html|json)'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: pretty-format-json
        args:
            - "--autofix"
            - "--no-sort-keys"
            - "--no-ensure-ascii"
-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.17
    hooks:
    - id: uv-lock
-   repo: local
    hooks:
    - id: flake8
      name: flake8
      entry: uv run --locked --extra linters flake8
      language: system
      types: [python]
    - id: black
      name: black
      entry: uv run --locked --extra linters black
      language: system
      types: [python]
